name: CI

on:
  push:
    branches: [master]
  pull_request:
  # So the suite can be run against the current tree without pushing.
  workflow_dispatch:

# A second push supersedes the first: no point finishing a run for a commit
# that is already stale, and it keeps the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, build, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Built here rather than inside Playwright's webServer so a broken build
      # is reported as a broken build, not as a test timeout.
      - name: Build
        run: pnpm build

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # Keyed on that version: a Playwright bump must fetch its own matching
      # browser build instead of reusing the cached one.
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Both projects drive Chromium, so the other browsers stay undownloaded.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test

      # Only on failure: the report is worth having when something broke and is
      # noise when nothing did. CI retries twice, and a trace is attached on
      # retry, so a flaky failure arrives with its timeline.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
