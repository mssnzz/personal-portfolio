# Build scripts are opt-in since pnpm 10: each package that wants to run one
# has to be answered here, or a fresh install stops and asks. Declared so a
# clone (and CI) installs unattended, with nothing unreviewed running.
allowBuilds:
  # Native image pipeline behind next/image when self-hosting.
  sharp: true
  # Native binding for the ESLint import resolver.
  unrs-resolver: true
  # Pulled in by the shadcn CLI. Its postinstall drops a mock service worker
  # into public/, which this project has no use for.
  msw: false
